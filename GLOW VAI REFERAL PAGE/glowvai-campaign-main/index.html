<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GLOW VAI - Partner Referral Gateway</title>
  <meta name="description" content="GLOW VAI Partner Referral Network - Official QR scan gateway for Auto Driver and Student Ambassador campaigns.">

  <!-- Firebase Web SDK (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=Syne:wght@800;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #09090B;
      --card: #18181B;
      --brand: #0050FF;
      --accent: #22C55E;
      --text: #FAFAFA;
      --muted: #A1A1AA;
      --border: #27272A;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px 16px; }
    .scan-card { width: 100%; max-width: 390px; background: var(--card); border: 1px solid var(--border); border-radius: 28px; padding: 32px 24px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; box-shadow: 0 16px 40px rgba(0,0,0,0.6); }
    .brand-syne { font-family: 'Syne', sans-serif; font-size: 1.65rem; font-weight: 900; color: #FFFFFF; letter-spacing: -0.02em; }
    .pulse-ring-box { width: 68px; height: 68px; background: rgba(0,80,255,0.15); border: 2px solid rgba(0,80,255,0.5); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; animation: pulseAnim 1.4s infinite; }
    @keyframes pulseAnim {
      0%   { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0,80,255,0.4); }
      70%  { transform: scale(1);    box-shadow: 0 0 0 12px rgba(0,80,255,0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0,80,255,0); }
    }
    .btn-direct { width: 100%; height: 52px; background: #0050FF; color: #FFFFFF; font-weight: 800; font-size: 0.95rem; border-radius: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 4px 16px rgba(0,80,255,0.4); transition: transform 0.1s ease; }
    .btn-direct:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="scan-card">
    <div class="brand-syne">GLOW VAI</div>
    <div class="pulse-ring-box">✨</div>
    <div>
      <span style="background:rgba(0,80,255,0.2);color:#60A5FA;font-size:0.72rem;font-weight:800;padding:4px 12px;border-radius:9999px;text-transform:uppercase;letter-spacing:0.05em;">
        Verified Partner Referral
      </span>
      <h1 style="font-size:1.3rem;font-weight:800;margin-top:10px;">Opening GLOW VAI Skin Scan...</h1>
      <p style="font-size:0.8rem;color:var(--muted);margin-top:4px;">
        Exclusive welcome perk from Partner <span id="lbl-partner-id" style="font-weight:800;color:#FFFFFF;">GLOWVAI</span>
      </p>
      <p style="font-size:0.72rem;color:#71717A;margin-top:6px;">Redirecting in under 0.8 seconds...</p>
    </div>
    <a id="targetBtn" href="https://glowvai.in/face-analysis" class="btn-direct">
      <span>✨ Start Free AI Skin Scan ➔</span>
    </a>
    <div style="font-size:0.72rem;color:#71717A;">Official GLOW VAI Referral Network</div>
  </div>

  <script>
    var APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxMKXA3nFFIlX4mmbTjrOMwSa1Vu7JSgx6HIlKqmT6jLcZ0qz5ppqWFcLczaIR1RxkAuw/exec';
    var TARGET_SITE_URL = 'https://glowvai.in/face-analysis';

    var params = new URLSearchParams(window.location.search);
    var rawRef = params.get('ref') || params.get('token') || params.get('partnerId') || params.get('driverId') || params.get('studentId');

    // No ref param -> send to partner portal
    if (!rawRef) {
      window.location.replace('./portal.html');
    }

    function cleanPartnerId(raw) {
      if (!raw) return 'GLV-GENERAL';
      var s = String(raw).trim().toUpperCase();
      if (s.indexOf('GLV-') === 0) return s;
      var isStudent = s.indexOf('STUDENT') !== -1 || s.indexOf('STU') !== -1;
      var prefix = isStudent ? 'GLV-STUDENT-' : 'GLV-AUTO-';
      var m = s.match(/\d+/);
      if (m) return prefix + String(parseInt(m[0], 10)).padStart(3, '0');
      return s;
    }

    function detectPlatform() {
      var ua = navigator.userAgent.toLowerCase();
      if (/iphone|ipad|ipod/.test(ua)) return 'iOS';
      if (/android/.test(ua)) return 'Android';
      if (/windows/.test(ua)) return 'Windows';
      if (/mac/.test(ua)) return 'macOS';
      return 'Mobile';
    }

    function getFp() {
      var s = [navigator.userAgent, screen.width, screen.height, new Date().getTimezoneOffset()].join('|');
      var h = 0;
      for (var i = 0; i < s.length; i++) { h = (h << 5) - h + s.charCodeAt(i); h |= 0; }
      return 'fp_' + Math.abs(h).toString(16);
    }

    var partnerId = cleanPartnerId(rawRef);
    var lbl = document.getElementById('lbl-partner-id');
    if (lbl) lbl.textContent = partnerId;
    var destUrl = TARGET_SITE_URL + '?ref=' + encodeURIComponent(partnerId);
    document.getElementById('targetBtn').href = destUrl;

    function logReferralWithRealIP(pid) {
      var ua = navigator.userAgent;
      var platform = detectPlatform();
      var fp = getFp();
      var clientIp = 'UNKNOWN';
      var location = '';

      fetch('https://ip-api.com/json/?fields=status,query,city,regionName,country', { mode: 'cors' })
        .then(function(r) { return r.json(); })
        .then(function(geo) {
          if (geo && geo.status === 'success') {
            clientIp = geo.query || 'UNKNOWN';
            location = [(geo.city || ''), (geo.regionName || ''), (geo.country || '')].filter(Boolean).join(', ');
          }
        })
        .catch(function() {})
        .finally(function() {
          fetch(APPS_SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain' },
            keepalive: true,
            body: JSON.stringify({
              action: 'LOG_REFERRAL',
              partnerId: pid,
              clientIp: clientIp,
              location: location,
              userAgent: ua,
              platform: platform,
              deviceFingerprint: fp
            })
          }).catch(function() {});

          try {
            if (typeof firebase !== 'undefined') {
              if (!firebase.apps.length) {
                firebase.initializeApp({
                  apiKey: 'AIzaSyBmnNTVqZ5vmSjimFLv3YXnQ_agHwR5H3s',
                  projectId: 'glowvai-v2'
                });
              }
              firebase.firestore().collection('referralPartners').doc(pid).set({
                totalScans: firebase.firestore.FieldValue.increment(1),
                totalReferrals: firebase.firestore.FieldValue.increment(1),
                lastScanAt: new Date().toISOString(),
                lastPlatform: platform,
                lastLocation: location
              }, { merge: true });
            }
          } catch(e) {}
        });
    }

    if (rawRef) logReferralWithRealIP(partnerId);

    setTimeout(function() {
      window.location.replace(destUrl);
    }, 800);
  </script>
</body>
</html>
